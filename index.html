<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratch Project</title>
  <style>
    body {
      margin: 0;
      background-color: #222;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    #scratch-stage {
      width: 480px;
      height: 360px;
      border: 2px solid #555;
      border-radius: 8px;
      background-color: #fff; /* 読み込み前は白背景 */
    }
    #error-log {
      color: #ff6b6b;
      margin-top: 15px;
      max-width: 480px;
      white-space: pre-wrap;
      font-size: 14px;
    }
  </style>

  <!-- unpkg CDN (安定版) -->
  <script src="https://unpkg.com/scratch-vm@0.2.0/dist/web/scratch-vm.js"></script>
  <script src="https://unpkg.com/scratch-render@0.1.0/dist/web/scratch-render.js"></script>
  <script src="https://unpkg.com/scratch-storage@1.3.4/dist/web/scratch-storage.js"></script>
  <script src="https://unpkg.com/scratch-audio@0.1.0/dist/web/scratch-audio.js"></script>
</head>
<body>

  <canvas id="scratch-stage" width="480" height="360"></canvas>
  <div id="error-log"></div>

  <script>
    const logError = (msg) => {
      console.error(msg);
      document.getElementById('error-log').innerText = msg;
    };

    document.addEventListener('DOMContentLoaded', async () => {
      const canvas = document.getElementById('scratch-stage');

      // 1. 各ライブラリの存在チェック
      if (!window.ScratchRender || !window.VirtualMachine) {
        logError('Scratchのライブラリ(CDN)の読み込みに失敗しました。');
        return;
      }

      try {
        // 2. エンジン初期化
        const renderer = new window.ScratchRender(canvas);
        const vm = new window.VirtualMachine();
        const audioEngine = new window.AudioEngine();
        const storage = new window.ScratchStorage();

        vm.attachRenderer(renderer);
        vm.attachAudioEngine(audioEngine);
        vm.attachStorage(storage);

        // 3. アセット読み込みパス設定
        storage.addWebStore(
          [storage.AssetType.ImageModule, storage.AssetType.ImageVector, storage.AssetType.Sound],
          (asset) => `./${asset.assetId}.${asset.dataFormat}`
        );

        // 4. project.json の取得
        const response = await fetch('./project.json');
        if (!response.ok) {
          throw new Error(`project.json の取得に失敗しました (Status: ${response.status})。ファイルが同じフォルダにあるか確認してください。`);
        }
        const projectJson = await response.json();

        // 5. ロードと実行
        await vm.loadProject(projectJson);
        vm.start();     // 描画ループ開始
        vm.greenFlag(); // 緑の旗を押す

      } catch (err) {
        logError(`エラーが発生しました:\n${err.message}`);
      }
    });
  </script>
</body>
</html>
