<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratch Project</title>
  <style>
    body {
      margin: 0;
      background-color: #222;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    #scratch-stage {
      width: 480px;
      height: 360px;
      border: 2px solid #555;
      border-radius: 8px;
      background-color: #fff; /* 読み込み前は白背景 */
    }
    #error-log {
      color: #ff6b6b;
      margin-top: 15px;
      max-width: 480px;
      white-space: pre-wrap;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <canvas id="scratch-stage" width="480" height="360"></canvas>
  <div id="error-log"></div>

  <script type="module">
    import VirtualMachine from 'https://esm.sh/scratch-vm@0.2.0?bundle';
    import ScratchRender from 'https://esm.sh/scratch-render@0.1.0?bundle';
    import ScratchStorage from 'https://esm.sh/scratch-storage@1.3.4?bundle';
    import AudioEngine from 'https://esm.sh/scratch-audio@0.1.0?bundle';

    const logError = (msg) => {
      console.error(msg);
      document.getElementById('error-log').innerText = msg;
    };

    async function init() {
      try {
        const canvas = document.getElementById('scratch-stage');
        
        const renderer = new ScratchRender(canvas);
        const vm = new VirtualMachine();
        const audioEngine = new AudioEngine();
        const storage = new ScratchStorage();

        vm.attachRenderer(renderer);
        vm.attachAudioEngine(audioEngine);
        vm.attachStorage(storage);

        // 同じフォルダ内のアセットを指す
        storage.addWebStore(
          [storage.AssetType.ImageModule, storage.AssetType.ImageVector, storage.AssetType.Sound],
          (asset) => `./${asset.assetId}.${asset.dataFormat}`
        );

        // キー入力の設定
        document.addEventListener('keydown', (e) => vm.postIOData('keyboard', { key: e.key, isDown: true }));
        document.addEventListener('keyup', (e) => vm.postIOData('keyboard', { key: e.key, isDown: false }));

        // project.json 取得
        const res = await fetch('./project.json');
        if (!res.ok) throw new Error(`project.json が見つかりません (Status: ${res.status})`);
        const projectJson = await res.json();

        await vm.loadProject(projectJson);
        vm.start();
        vm.greenFlag();

      } catch (err) {
        logError(`エラー発生: ${err.message}`);
      }
    }

    init();
  </script>
</body>
</html>
