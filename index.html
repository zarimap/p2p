<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratch Player</title>
  <style>
    body {
      margin: 0;
      background-color: #222;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    #scratch-stage {
      width: 480px;
      height: 360px;
      border: 2px solid #555;
      border-radius: 8px;
      background-color: #000;
    }
    #error-log {
      color: #ff6b6b;
      margin-top: 15px;
      max-width: 480px;
      white-space: pre-wrap;
      font-size: 13px;
    }
  </style>
  <!-- 打開策：バンドル済みのScratch VMスタンドアロンスクリプトを読み込む -->
  <script src="https://cdn.jsdelivr.net/npm/scratch-vm@0.2.0/dist/web/scratch-vm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/scratch-render@0.1.0/dist/web/scratch-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/scratch-storage@1.3.4/dist/web/scratch-storage.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/scratch-audio@0.1.0/dist/web/scratch-audio.min.js"></script>
</head>
<body>

  <canvas id="scratch-stage" width="480" height="360"></canvas>
  <div id="error-log"></div>

  <script>
    const logError = (msg) => {
      console.error(msg);
      document.getElementById('error-log').innerText = msg;
    };

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const canvas = document.getElementById('scratch-stage');
        
        // グローバルオブジェクトから初期化
        const VirtualMachine = window.VirtualMachine;
        const ScratchRender = window.ScratchRender;
        const ScratchStorage = window.ScratchStorage;
        const AudioEngine = window.AudioEngine;

        if (!VirtualMachine || !ScratchRender) {
          throw new Error('ライブラリのロードに失敗しました。');
        }

        const renderer = new ScratchRender(canvas);
        const vm = new VirtualMachine();
        const audioEngine = new AudioEngine();
        const storage = new ScratchStorage();

        vm.attachRenderer(renderer);
        vm.attachAudioEngine(audioEngine);
        vm.attachStorage(storage);

        storage.addWebStore(
          [storage.AssetType.ImageModule, storage.AssetType.ImageVector, storage.AssetType.Sound],
          (asset) => `./${asset.assetId}.${asset.dataFormat}`
        );

        document.addEventListener('keydown', (e) => vm.postIOData('keyboard', { key: e.key, isDown: true }));
        document.addEventListener('keyup', (e) => vm.postIOData('keyboard', { key: e.key, isDown: false }));

        const res = await fetch('./project.json');
        if (!res.ok) throw new Error(`project.json が見つかりません (Status: ${res.status})`);
        const projectJson = await res.json();

        await vm.loadProject(projectJson);
        vm.start();
        vm.greenFlag();

      } catch (err) {
        logError(`エラー発生: ${err.message}`);
      }
    });
  </script>
</body>
</html>
